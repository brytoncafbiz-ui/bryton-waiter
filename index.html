<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#1a1310" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Bryton Waiter</title>
<style>
  :root{
    --bg:#1a1310; --bg2:#241a15; --surface:#2e211a; --surface2:#3a2b22;
    --border:#4a3728; --borderSoft:#3a2b22; --text:#f4ece3; --muted:#c9b8a8;
    --faint:#8a7867; --accent:#c8703c; --accentDark:#9c5228; --gold:#d9a441;
    --sage:#8a9a6b; --danger:#c05a4a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:'DM Sans',system-ui,-apple-system,sans-serif;overscroll-behavior:none}
  body{max-width:560px;margin:0 auto;min-height:100vh}
  .display{font-family:'Fraunces',Georgia,serif}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{font-family:inherit;font-size:16px}
  .app{padding:14px 14px 120px}
  .topbar{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--bg) 70%,transparent);
    padding:12px 14px 8px;display:flex;align-items:center;gap:10px}
  .logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(140deg,var(--accent),var(--accentDark));
    display:grid;place-items:center;font-weight:800;color:#fff;font-size:18px;flex-shrink:0}
  .h1{font-size:19px;font-weight:800;margin:0}
  .sub{font-size:12px;color:var(--faint);margin:1px 0 0}
  .card{background:var(--bg2);border:1px solid var(--border);border-radius:18px;padding:16px;margin-bottom:12px}
  .lbl{font-size:12px;color:var(--muted);font-weight:700;display:block;margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px}
  .inp{width:100%;background:var(--surface);border:1px solid var(--borderSoft);border-radius:12px;
    padding:12px 14px;color:var(--text);outline:none}
  .btn{border-radius:13px;padding:14px 16px;font-size:15px;font-weight:700;display:flex;align-items:center;
    justify-content:center;gap:8px;width:100%;transition:transform .05s}
  .btn:active{transform:scale(.98)}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-ghost{background:var(--surface);color:var(--text);border:1px solid var(--border)}
  .btn-sage{background:var(--sage);color:#20250f}
  .btn-sm{padding:9px 12px;font-size:13px;border-radius:10px;width:auto}
  .row{display:flex;gap:8px}
  .chip{padding:8px 13px;border-radius:20px;font-size:13px;font-weight:700;white-space:nowrap;
    border:1.5px solid var(--border);background:var(--surface);color:var(--muted)}
  .chip.on{border-color:var(--accent);background:rgba(200,112,60,.16);color:var(--accent)}
  .scroll-x{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
  .scroll-x::-webkit-scrollbar{display:none}
  .item{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--bg2);
    border:1px solid var(--borderSoft);border-radius:14px;padding:13px 15px;margin-bottom:8px}
  .item:active{background:var(--surface)}
  .item .nm{font-weight:600;font-size:15px}
  .item .mt{font-size:12px;color:var(--faint);margin-top:2px}
  .price{font-family:'Fraunces',serif;font-weight:700;color:var(--gold);white-space:nowrap}
  .qbtn{width:34px;height:34px;border-radius:10px;background:var(--surface2);color:var(--text);
    font-size:20px;font-weight:700;display:grid;place-items:center;flex-shrink:0}
  .qbtn:active{background:var(--accent);color:#fff}
  .secthead{font-size:12px;color:var(--faint);font-weight:800;text-transform:uppercase;letter-spacing:.6px;margin:16px 2px 8px}
  .overlay{position:fixed;inset:0;background:rgba(8,6,4,.7);backdrop-filter:blur(3px);z-index:50;
    display:flex;align-items:flex-end;justify-content:center}
  .sheet{background:var(--bg2);border-top-left-radius:24px;border-top-right-radius:24px;
    width:100%;max-width:560px;max-height:88vh;overflow-y:auto;padding:20px 18px 28px;
    border:1px solid var(--border);animation:up .22s ease}
  @keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:translateY(0);opacity:1}}
  .optrow{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:12px;
    border:1.5px solid var(--border);background:var(--surface);margin-bottom:8px}
  .optrow.on{border-color:var(--accent);background:rgba(200,112,60,.14)}
  .footbar{position:fixed;bottom:0;left:0;right:0;max-width:560px;margin:0 auto;padding:12px 14px;
    background:linear-gradient(0deg,var(--bg) 76%,transparent);z-index:30}
  .badge{background:var(--accent);color:#fff;border-radius:999px;font-size:12px;font-weight:800;
    min-width:22px;height:22px;padding:0 6px;display:inline-grid;place-items:center}
  .toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--surface2);
    color:var(--text);padding:11px 18px;border-radius:12px;font-size:14px;z-index:100;border:1px solid var(--border);
    box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:90%;text-align:center}
  .muted{color:var(--muted)} .faint{color:var(--faint)} .gold{color:var(--gold)}
  .tiny{font-size:12px}
  a{color:var(--accent)}
</style>
</head>
<body>
<div id="root"></div>

<script>
/* ---------- Bryton Waiter — standalone order-taking web app ----------
   Loads the menu exported from the POS, lets a waiter build an order,
   and sends it (file or text) to the cashier via WhatsApp / share sheet.
   The output matches the POS "Import order" format exactly.               */

var LS = {
  name: "bryton_waiter_name",
  menu: "bryton_waiter_menu",
  seq:  "bryton_waiter_seq",
};
var money = function(n){ return "Rp " + (Math.round(n||0)).toLocaleString("id-ID"); };
var $ = function(id){ return document.getElementById(id); };
var esc = function(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); };

/* ---- state ---- */
var state = {
  waiter: localStorage.getItem(LS.name) || "",
  menu: null,          // { exportedAt, items:[...] }
  cat: "All",
  search: "",
  mode: "dinein",      // dinein | takeaway
  table: "",
  guests: 1,           // number of customers (dine-in)
  orderType: "first",  // first | additional (dine-in only)
  cart: [],            // [{ menuId, name, qty, variants:[{group,name,price}], note, unit }]
  sheet: null,         // variant/config sheet item
};
try { var m = localStorage.getItem(LS.menu); if (m) state.menu = JSON.parse(m); } catch(e){}

function saveName(n){ state.waiter = n; localStorage.setItem(LS.name, n); }
function saveMenu(obj){ state.menu = obj; localStorage.setItem(LS.menu, JSON.stringify(obj)); }
function nextSeq(){ var n = (parseInt(localStorage.getItem(LS.seq)||"0",10)||0) + 1; localStorage.setItem(LS.seq, String(n)); return n; }

function toast(msg){
  var t = document.createElement("div"); t.className="toast"; t.textContent=msg;
  document.body.appendChild(t); setTimeout(function(){ t.style.opacity="0"; t.style.transition="opacity .3s"; setTimeout(function(){t.remove();},300); }, 1800);
}

/* ---- menu helpers ---- */
function catList(){
  var cats = ["All"]; var seen={};
  (state.menu.items||[]).forEach(function(m){ if(m.cat && !seen[m.cat]){ seen[m.cat]=1; cats.push(m.cat); } });
  return cats;
}
function visibleItems(){
  var q = state.search.trim().toLowerCase();
  return (state.menu.items||[]).filter(function(m){
    if (state.cat!=="All" && m.cat!==state.cat) return false;
    if (q && m.name.toLowerCase().indexOf(q)<0) return false;
    return true;
  });
}
function cartCount(){ return state.cart.reduce(function(s,l){return s+l.qty;},0); }
function cartTotal(){ return state.cart.reduce(function(s,l){return s+l.unit*l.qty;},0); }
function variantSummary(vs){ return (vs||[]).map(function(v){return v.name;}).join(" · "); }
function variantsDelta(vs){ return (vs||[]).reduce(function(s,v){return s+(v.price||0);},0); }
function lineSig(menuId, vs){ return menuId + "|" + (vs||[]).map(function(v){return v.group+"="+v.name;}).join("&"); }

/* ============================ RENDER ============================ */
function render(){
  if (!state.menu || !state.menu.items || !state.menu.items.length){ return renderLoadMenu(); }
  if (!state.waiter){ return renderName(); }
  renderOrder();
}

/* ---- 1. name screen ---- */
function renderName(){
  $("root").innerHTML =
    '<div class="topbar"><div class="logo">B</div><div><div class="h1 display">Bryton Waiter</div>'+
    '<div class="sub">Order taking</div></div></div>'+
    '<div class="app"><div class="card">'+
    '<label class="lbl">Your name</label>'+
    '<input id="nm" class="inp" placeholder="e.g. Sari" value="'+esc(state.waiter)+'" autocomplete="off">'+
    '<p class="tiny faint" style="margin:10px 2px 0">This is saved on this phone and added to every order you send, so the cashier knows who took it.</p>'+
    '<button class="btn btn-primary" style="margin-top:16px" onclick="onSaveName()">Continue</button>'+
    '</div>'+
    '<button class="btn btn-ghost" onclick="renderLoadMenu()">Load / update menu</button>'+
    '</div>';
  setTimeout(function(){ var e=$("nm"); if(e) e.focus(); },100);
}
window.onSaveName = function(){
  var v = $("nm").value.trim();
  if (!v){ toast("Please enter your name"); return; }
  saveName(v); render();
};

/* ---- 2. load-menu screen ---- */
function renderLoadMenu(){
  var has = state.menu && state.menu.items;
  $("root").innerHTML =
    '<div class="topbar"><div class="logo">B</div><div><div class="h1 display">Menu</div>'+
    '<div class="sub">Load the menu from the POS</div></div></div>'+
    '<div class="app"><div class="card">'+
    (has ? '<p class="tiny sage" style="margin:0 0 12px">✓ Menu loaded — '+(state.menu.items.length)+' items'+
            (state.menu.exportedAt ? ' · exported '+new Date(state.menu.exportedAt).toLocaleDateString() : '')+'</p>' : '')+
    '<p class="tiny muted" style="margin:0 0 12px;line-height:1.5">Ask the manager to tap <b>Settings → Export menu for waiter app</b> in the POS and send you the <b>bryton-menu</b> file. Then load it here (open it once — it stays on this phone).</p>'+
    '<input id="mfile" type="file" accept=".json,.txt,application/json,text/plain" style="display:none" onchange="onMenuFile(event)">'+
    '<button class="btn btn-primary" onclick="document.getElementById(\'mfile\').click()">Choose menu file</button>'+
    '<div style="text-align:center;margin:12px 0;color:var(--faint);font-size:12px;font-weight:700">OR PASTE</div>'+
    '<textarea id="mpaste" class="inp" rows="4" placeholder="Paste the menu text here…" style="font-family:monospace;font-size:12px"></textarea>'+
    '<button class="btn btn-ghost" style="margin-top:10px" onclick="onMenuPaste()">Load pasted menu</button>'+
    (state.waiter ? '<button class="btn btn-ghost" style="margin-top:10px" onclick="render()">Back</button>' : '')+
    '</div></div>';
}
function loadMenuText(txt){
  try{
    var obj = JSON.parse(txt);
    if (!obj || obj._type!=="bryton-menu" || !Array.isArray(obj.items) || !obj.items.length){ toast("Not a valid menu file"); return; }
    saveMenu(obj); toast("Menu loaded — "+obj.items.length+" items"); render();
  }catch(e){ toast("Couldn't read that menu"); }
}
window.onMenuFile = function(ev){
  var f = ev.target.files && ev.target.files[0]; ev.target.value="";
  if(!f) return; var r=new FileReader(); r.onload=function(){ loadMenuText(r.result); }; r.onerror=function(){toast("Couldn't read file");}; r.readAsText(f);
};
window.onMenuPaste = function(){ var t=$("mpaste").value.trim(); if(!t){toast("Paste the menu first");return;} loadMenuText(t); };

/* ---- 3. main order screen ---- */
function renderOrder(){
  var cats = catList();
  var items = visibleItems();
  var groups = {};
  items.forEach(function(m){ var s=m.sub||"Other"; (groups[s]=groups[s]||[]).push(m); });

  var html =
    '<div class="topbar"><div class="logo">B</div>'+
    '<div style="flex:1"><div class="h1 display">New order</div>'+
    '<div class="sub">Waiter: '+esc(state.waiter)+' · <a onclick="renderName()">change</a></div></div>'+
    '<button class="btn btn-ghost btn-sm" onclick="renderLoadMenu()">Menu</button></div>'+
    '<div class="app">';

  // dine-in / takeaway
  html +=
    '<div class="card" style="padding:13px 14px">'+
    '<div class="row" style="margin-bottom:10px">'+
    '<button class="chip '+(state.mode==="dinein"?"on":"")+'" style="flex:1;text-align:center" onclick="setMode(\'dinein\')">Dine-in</button>'+
    '<button class="chip '+(state.mode==="takeaway"?"on":"")+'" style="flex:1;text-align:center" onclick="setMode(\'takeaway\')">Takeaway</button>'+
    '</div>'+
    (state.mode==="dinein"
      ? '<input id="tbl" class="inp" placeholder="Table number (e.g. 12)" value="'+esc(state.table)+'" oninput="state.table=this.value" autocomplete="off">'+
        '<div class="lbl" style="margin:12px 0 6px">Number of customers</div>'+
        '<div style="display:flex;align-items:center;gap:16px">'+
        '<button class="qbtn" onclick="setGuests(-1)">−</button>'+
        '<span class="display" style="font-size:20px;font-weight:700;min-width:28px;text-align:center">'+state.guests+'</span>'+
        '<button class="qbtn" onclick="setGuests(1)">+</button></div>'+
        '<div class="lbl" style="margin:14px 0 6px">This order is</div>'+
        '<div class="row">'+
        '<button class="chip '+(state.orderType==="first"?"on":"")+'" style="flex:1;text-align:center" onclick="setOtype(\'first\')">First order</button>'+
        '<button class="chip '+(state.orderType==="additional"?"on":"")+'" style="flex:1;text-align:center" onclick="setOtype(\'additional\')">Additional order</button>'+
        '</div>'
      : '<p class="tiny faint" style="margin:2px">No table needed for takeaway.</p>')+
    '</div>';

  // search + categories
  html +=
    '<input class="inp" placeholder="Search menu…" value="'+esc(state.search)+'" oninput="onSearch(this.value)" style="margin-bottom:10px" autocomplete="off">'+
    '<div class="scroll-x" style="margin-bottom:6px">'+
    cats.map(function(c){ return '<button class="chip '+(state.cat===c?"on":"")+'" onclick="setCat(\''+esc(c)+'\')">'+esc(c)+'</button>'; }).join("")+
    '</div>';

  // items grouped by sub
  Object.keys(groups).forEach(function(sub){
    html += '<div class="secthead">'+esc(sub)+'</div>';
    groups[sub].forEach(function(m){
      var hasVar = m.variants && m.variants.length;
      var inCart = state.cart.filter(function(l){return l.menuId===m.id;}).reduce(function(s,l){return s+l.qty;},0);
      html +=
        '<div class="item" onclick="tapItem(\''+m.id+'\')">'+
        '<div style="min-width:0"><div class="nm">'+esc(m.name)+(inCart?' <span class="badge" style="vertical-align:middle">'+inCart+'</span>':'')+'</div>'+
        '<div class="mt">'+money(m.price)+(hasVar?' · options':'')+'</div></div>'+
        '<div class="qbtn">+</div>'+
        '</div>';
    });
  });
  if (!items.length) html += '<p class="faint" style="text-align:center;padding:24px">No items found.</p>';

  html += '</div>'; // .app

  // footer: review order
  html +=
    '<div class="footbar"><button class="btn btn-primary" onclick="openCart()" '+(cartCount()?'':'style="opacity:.5"')+'>'+
    'Review order '+(cartCount()?'<span class="badge" style="background:rgba(255,255,255,.25)">'+cartCount()+'</span> · '+money(cartTotal()):'')+
    '</button></div>';

  $("root").innerHTML = html;
}
window.onSearch = function(v){ state.search=v; var a=document.activeElement; renderOrder(); /* keep focus */ var i=document.querySelector('input[placeholder="Search menu…"]'); if(i){ i.focus(); i.setSelectionRange(v.length,v.length);} };
window.setCat = function(c){ state.cat=c; renderOrder(); };
window.setMode = function(m){ state.mode=m; renderOrder(); };
window.setOtype = function(t){ state.orderType=t; renderOrder(); };
window.setGuests = function(d){ state.guests = Math.max(1, state.guests + d); renderOrder(); };

/* ---- tap an item: add directly, or open variant sheet ---- */
window.tapItem = function(id){
  var m = state.menu.items.find(function(x){return x.id===id;});
  if (!m) return;
  if (m.variants && m.variants.length){ openConfig(m); }
  else { addToCart(m, [], "", 1); toast(m.name+" added"); }
};

function addToCart(m, variants, note, qty){
  var unit = m.price + variantsDelta(variants);
  var sig = lineSig(m.id, variants);
  // merge only when no note (notes stay as separate lines, like the POS)
  var ex = !note ? state.cart.find(function(l){ return lineSig(l.menuId,l.variants)===sig && !l.note; }) : null;
  if (ex){ ex.qty += qty; }
  else { state.cart.push({ menuId:m.id, name:m.name, qty:qty, variants:variants, note:note||"", unit:unit }); }
}

/* ---- variant/config sheet ---- */
var cfg = null;
function openConfig(m){
  cfg = { m:m, sel:{}, note:"", qty:1 };
  // preselect first option of required single-choice groups
  (m.variants||[]).forEach(function(g){ if(g.required && !g.multi && g.items[0]) cfg.sel[g.name]=[g.items[0].name]; });
  drawConfig();
}
function drawConfig(){
  var m = cfg.m;
  var body =
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">'+
    '<div class="h1 display">'+esc(m.name)+'</div>'+
    '<button class="qbtn" onclick="closeSheet()" style="font-size:16px">✕</button></div>'+
    '<div class="tiny gold" style="margin-bottom:14px">'+money(m.price)+' base</div>';

  (m.variants||[]).forEach(function(g){
    body += '<div class="lbl" style="margin-top:8px">'+esc(g.name)+(g.required?' <span class="gold">*</span>':'')+
            (g.multi?' <span class="faint">(choose any)</span>':'')+'</div>';
    (g.items||[]).forEach(function(op){
      var on = (cfg.sel[g.name]||[]).indexOf(op.name)>=0;
      body += '<div class="optrow '+(on?"on":"")+'" onclick="pickOpt(\''+esc(g.name)+'\',\''+esc(op.name)+'\','+(g.multi?'true':'false')+')">'+
              '<span>'+(on?'● ':'○ ')+esc(op.name)+'</span>'+
              '<span class="tiny '+(op.price?'gold':'faint')+'">'+(op.price?('+'+money(op.price)):'—')+'</span></div>';
    });
  });

  body +=
    '<label class="lbl" style="margin-top:14px">Note (optional)</label>'+
    '<input id="cnote" class="inp" placeholder="e.g. no onions" value="'+esc(cfg.note)+'" oninput="cfg.note=this.value" autocomplete="off">'+
    '<div style="display:flex;align-items:center;gap:14px;margin:16px 0 4px;justify-content:center">'+
    '<button class="qbtn" onclick="cfgQty(-1)">−</button>'+
    '<span class="display" style="font-size:22px;font-weight:700;min-width:30px;text-align:center">'+cfg.qty+'</span>'+
    '<button class="qbtn" onclick="cfgQty(1)">+</button></div>'+
    '<button class="btn btn-primary" style="margin-top:12px" onclick="confirmConfig()">Add · '+money(currentCfgUnit()*cfg.qty)+'</button>';

  $("root").insertAdjacentHTML("beforeend",
    '<div class="overlay" id="sheet" onclick="if(event.target===this)closeSheet()"><div class="sheet">'+body+'</div></div>');
}
function currentCfgUnit(){
  var d=0; var m=cfg.m;
  (m.variants||[]).forEach(function(g){ (cfg.sel[g.name]||[]).forEach(function(nm){ var op=(g.items||[]).find(function(o){return o.name===nm;}); if(op) d+=op.price||0; }); });
  return m.price + d;
}
window.pickOpt = function(group, name, multi){
  var cur = cfg.sel[group] || [];
  if (multi){ var i=cur.indexOf(name); if(i>=0)cur.splice(i,1); else cur.push(name); }
  else { cur = [name]; }
  cfg.sel[group]=cur;
  var note=$("cnote"); if(note)cfg.note=note.value;
  refreshSheet();
};
window.cfgQty = function(d){ cfg.qty=Math.max(1,cfg.qty+d); var note=$("cnote"); if(note)cfg.note=note.value; refreshSheet(); };
function refreshSheet(){ var s=$("sheet"); if(s)s.remove(); drawConfig(); }
window.closeSheet = function(){ var s=$("sheet"); if(s)s.remove(); cfg=null; };
window.confirmConfig = function(){
  var m=cfg.m;
  // required check
  var missing=null;
  (m.variants||[]).forEach(function(g){ if(g.required && !(cfg.sel[g.name]&&cfg.sel[g.name].length)) missing=g.name; });
  if (missing){ toast("Please choose "+missing); return; }
  var variants=[];
  (m.variants||[]).forEach(function(g){ (cfg.sel[g.name]||[]).forEach(function(nm){ var op=(g.items||[]).find(function(o){return o.name===nm;}); if(op) variants.push({group:g.name,name:op.name,price:op.price||0}); }); });
  var note=$("cnote"); addToCart(m, variants, note?note.value.trim():"", cfg.qty);
  closeSheet(); toast(m.name+" added"); renderOrder();
};

/* ---- cart / review sheet ---- */
window.openCart = function(){
  if (!state.cart.length){ toast("Add some items first"); return; }
  var body =
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">'+
    '<div class="h1 display">Order</div><button class="qbtn" onclick="closeSheet()" style="font-size:16px">✕</button></div>';
  state.cart.forEach(function(l,idx){
    body +=
      '<div style="display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--borderSoft)">'+
      '<div style="flex:1;min-width:0"><div style="font-weight:600">'+esc(l.name)+'</div>'+
      (l.variants&&l.variants.length?'<div class="tiny faint">'+esc(variantSummary(l.variants))+'</div>':'')+
      (l.note?'<div class="tiny gold">“'+esc(l.note)+'”</div>':'')+
      '<div class="tiny faint">'+money(l.unit)+' each</div></div>'+
      '<div style="display:flex;align-items:center;gap:8px">'+
      '<button class="qbtn" onclick="cartQty('+idx+',-1)">−</button>'+
      '<span style="min-width:18px;text-align:center;font-weight:700">'+l.qty+'</span>'+
      '<button class="qbtn" onclick="cartQty('+idx+',1)">+</button></div>'+
      '<div class="price" style="min-width:70px;text-align:right">'+money(l.unit*l.qty)+'</div></div>';
  });
  body +=
    '<div style="display:flex;justify-content:space-between;margin:14px 2px;font-weight:800">'+
    '<span>Total ('+cartCount()+')</span><span class="gold display" style="font-size:18px">'+money(cartTotal())+'</span></div>'+
    (state.mode==="dinein"
      ? '<div class="tiny muted" style="margin:0 2px 12px">Table: <b>'+(state.table.trim()||'— not set —')+'</b> · <b>'+state.guests+' pax</b> · <b>'+(state.orderType==="additional"?"Additional order":"First order")+'</b></div>'
      : '<div class="tiny muted" style="margin:0 2px 12px">Takeaway order</div>')+
    '<button class="btn btn-sage" onclick="sendOrder()">Send to cashier</button>'+
    '<div class="row" style="margin-top:9px">'+
    '<button class="btn btn-ghost btn-sm" style="flex:1" onclick="copyOrder()">Copy text</button>'+
    '<button class="btn btn-ghost btn-sm" style="flex:1" onclick="downloadOrder()">Save file</button></div>'+
    '<button class="btn btn-ghost" style="margin-top:9px;color:var(--danger)" onclick="clearCart()">Clear order</button>';
  $("root").insertAdjacentHTML("beforeend",
    '<div class="overlay" id="sheet" onclick="if(event.target===this)closeSheet()"><div class="sheet">'+body+'</div></div>');
};
window.cartQty = function(idx,d){
  state.cart[idx].qty += d;
  if (state.cart[idx].qty<=0) state.cart.splice(idx,1);
  var s=$("sheet"); if(s)s.remove();
  renderOrder();
  if (state.cart.length) openCart();
};
window.clearCart = function(){ state.cart=[]; closeSheet(); renderOrder(); toast("Order cleared"); };

/* ---- build the order object (matches POS Import format) ---- */
function buildOrder(){
  return {
    _type: "bryton-order",
    orderId: "WO-" + Date.now().toString(36) + "-" + nextSeq(),
    createdAt: new Date().toISOString(),
    waiter: state.waiter,
    suggestedTable: state.mode==="dinein" ? state.table.trim() : "",
    guests: state.mode==="dinein" ? state.guests : undefined,
    takeaway: state.mode==="takeaway",
    additional: state.mode==="dinein" && state.orderType==="additional",
    items: state.cart.map(function(l){
      return { menuId:l.menuId, name:l.name, qty:l.qty, variants:l.variants, note:l.note, price:l.unit };
    }),
  };
}
function orderFilename(o){ return "order-"+(o.suggestedTable?("T"+o.suggestedTable):"takeaway")+"-"+o.orderId+".txt"; }

window.sendOrder = function(){
  if (state.mode==="dinein" && !state.table.trim()){ toast("Enter the table number first"); return; }
  if (!state.cart.length){ toast("Add items first"); return; }
  var o = buildOrder();
  var txt = JSON.stringify(o);
  var fname = orderFilename(o);
  // best: share the file; fall back to sharing text; fall back to copy
  try{
    if (navigator.canShare){
      var file = new File([txt], fname, { type:"text/plain" });
      if (navigator.canShare({ files:[file] })){
        navigator.share({ files:[file], title:"Order "+(o.suggestedTable?("T"+o.suggestedTable):"takeaway") })
          .then(function(){ afterSend(); }).catch(function(){});
        return;
      }
    }
    if (navigator.share){
      navigator.share({ text: txt, title:"Order" }).then(function(){ afterSend(); }).catch(function(){});
      return;
    }
  }catch(e){}
  // no share API → copy + open WhatsApp
  copyText(txt);
  window.open("https://wa.me/?text="+encodeURIComponent(txt), "_blank");
  afterSend();
};
function afterSend(){
  toast("Order sent — start a new one");
  state.cart=[]; if (state.mode==="dinein") state.table="";
  closeSheet(); renderOrder();
}
window.copyOrder = function(){ copyText(JSON.stringify(buildOrder())); toast("Order text copied — paste it in WhatsApp"); };
function copyText(t){
  try{ navigator.clipboard.writeText(t); }
  catch(e){ var ta=document.createElement("textarea"); ta.value=t; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy");}catch(_){} ta.remove(); }
}
window.downloadOrder = function(){
  var o=buildOrder(); var txt=JSON.stringify(o);
  try{ var blob=new Blob([txt],{type:"text/plain"}); var url=URL.createObjectURL(blob);
    var a=document.createElement("a"); a.href=url; a.download=orderFilename(o); a.click(); URL.revokeObjectURL(url);
    toast("File saved — attach it in WhatsApp");
  }catch(e){ toast("Couldn't save file"); }
};

render();
</script>
</body>
</html>
